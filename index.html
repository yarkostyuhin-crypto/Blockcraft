<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Блоккрафт</title>
<style>
:root{--hud:rgba(20,24,30,.45);--line:rgba(255,255,255,.6);--on:#ffd84a;--txt:#fff;color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hud:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--hud:rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{height:100%;margin:0;overflow:hidden;background:#8ec5ff;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#t{position:fixed;inset:0;z-index:1}
.b{position:fixed;z-index:3;border-radius:50%;background:var(--hud);border:2px solid var(--line);color:var(--txt);display:flex;align-items:center;justify-content:center;font-size:30px;touch-action:none}
.b:active,.b.on{background:var(--on);color:#222}
#jump{width:80px;height:80px;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(32px + env(safe-area-inset-bottom,0px))}
#mode{width:64px;height:64px;right:calc(32px + env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px));font-size:28px}
#dist,#new{width:44px;height:44px;left:calc(10px + env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));font-size:15px}
#new{top:calc(122px + env(safe-area-inset-top,0px))}
#fly{width:56px;height:56px;right:calc(36px + env(safe-area-inset-right,0px));bottom:calc(208px + env(safe-area-inset-bottom,0px));font-size:26px}
#jb{position:fixed;z-index:2;width:120px;height:120px;left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));border-radius:50%;background:var(--hud);border:2px solid var(--line);opacity:.55;pointer-events:none}
#jb.on{opacity:.95}
#jk{position:absolute;left:34px;top:34px;width:52px;height:52px;border-radius:50%;background:var(--line)}
#bar{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;background:var(--hud);border-radius:10px;border:2px solid var(--line)}
.s{width:34px;height:34px;border-radius:6px;border:3px solid transparent}
.s.on{border-color:var(--on);transform:scale(1.1)}
#x{position:fixed;z-index:2;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;pointer-events:none}
#x:before,#x:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#x:before{left:8px;top:0;width:2px;height:18px}#x:after{top:8px;left:0;height:2px;width:18px}
#h{position:fixed;z-index:3;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(50vw,220px);text-align:center;font-size:15px;line-height:1.4;padding:10px 14px;border-radius:10px;background:var(--hud);transition:opacity .6s;pointer-events:none}
#c{position:fixed;z-index:3;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));font-size:12px;padding:4px 8px;border-radius:8px;background:var(--hud);pointer-events:none}
#menu{position:fixed;inset:0;z-index:20;background:linear-gradient(#8ec5ff,#4a8a3a);display:flex;flex-direction:column;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));gap:14px;color:#fff}
#menu h1{margin:0;font-size:32px;text-shadow:0 2px 4px rgba(0,0,0,.4)}
#wl{width:min(100%,420px);flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;touch-action:pan-y}
.r{display:flex;gap:8px}
#menu button{font:inherit;font-size:18px;color:#fff;background:rgba(0,0,0,.45);border:2px solid var(--line);border-radius:10px;padding:14px;text-align:left;touch-action:manipulation}
.pl{flex:1}.dl{width:56px;text-align:center!important}
.nb{display:flex;gap:10px;width:min(100%,420px)}.nb button{flex:1;text-align:center!important;background:rgba(0,0,0,.6)!important}
#hp{position:fixed;z-index:3;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);color:#ff4a5a;font-size:16px;letter-spacing:1px;text-shadow:0 1px 3px #000;pointer-events:none;white-space:nowrap}
#dmg{position:fixed;inset:0;z-index:2;background:rgba(220,20,20,.5);opacity:0;transition:opacity .3s;pointer-events:none}
#craft{right:calc(12px + env(safe-area-inset-right,0px));top:calc(164px + env(safe-area-inset-top,0px));width:48px;height:48px;font-size:22px}
#bar{gap:4px}.s{flex:0 0 auto;width:32px;height:32px}
#c{top:calc(178px + env(safe-area-inset-top,0px))!important}
#mp{position:fixed;z-index:3;left:50%;top:calc(50% + 26px);width:64px;height:7px;margin-left:-32px;border:1px solid #fff;display:none;pointer-events:none}
#mp i{display:block;height:100%;width:0;background:#ffd84a}
#cr,#iv,#adm{position:fixed;z-index:15;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:460px;margin:auto;background:rgba(10,12,16,.93);border:2px solid var(--line);border-radius:12px;padding:12px;display:none;flex-direction:column;gap:6px;overflow-y:auto;touch-action:pan-y;font-size:14px;line-height:1.35}
#cr *,#iv *,#adm *{touch-action:pan-y}
#cr button,#iv button,#adm button{font:inherit;color:#fff;background:rgba(255,255,255,.14);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;flex:0 0 auto}
#cr button.no{opacity:.38}.ch{display:flex;justify-content:space-between;align-items:center}.ch button{width:44px;text-align:center!important}
.s,.c{position:relative;background:#3a3d44}
.s .ic{font-size:18px;font-weight:400;line-height:26px;display:block;text-align:center}
.c .ic{font-size:24px;font-weight:400}
.s em,.c em{position:absolute;right:2px;bottom:0;font:700 11px system-ui;font-style:normal;color:#fff;text-shadow:0 1px 2px #000}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.hr{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.c{aspect-ratio:1;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center}
.c.on{border-color:var(--on);box-shadow:0 0 0 1px var(--on)}
.dt{background:rgba(255,255,255,.08);border-radius:8px;padding:10px;min-height:64px}
#bag{right:calc(12px + env(safe-area-inset-right,0px));top:calc(216px + env(safe-area-inset-top,0px));width:48px;height:48px;font-size:22px}
.im{width:22px;height:22px;vertical-align:middle;image-rendering:pixelated}
.dt .im{width:44px;height:44px;float:left;margin-right:10px}
#menu input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px;border-radius:10px;border:2px solid var(--line);background:rgba(0,0,0,.45);color:#fff;user-select:text;-webkit-user-select:text;touch-action:manipulation}
#mmsg{font-size:15px;line-height:1.35;text-align:center;background:rgba(0,0,0,.65);border-radius:8px;padding:8px 10px;width:min(100%,420px)}#mmsg:empty{display:none}
#menu{overflow-y:auto}#wl{flex:1 0 140px}
#acc{display:none;flex-direction:column;gap:8px;width:min(100%,420px)}.col{display:flex;flex-direction:column;gap:8px}
#menu select{flex:1;font:inherit;font-size:17px;padding:12px;border-radius:10px;border:2px solid var(--line);background:rgba(0,0,0,.55);color:#fff}
#menu #rp{flex:none;width:22px;height:22px;padding:0}
#admb{right:calc(12px + env(safe-area-inset-right,0px));top:calc(268px + env(safe-area-inset-top,0px));width:48px;height:48px;font-size:22px}
#mm{position:fixed;z-index:3;right:calc(10px + env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));width:90px;height:90px;border:2px solid rgba(255,255,255,.75);border-radius:8px;background:#000;image-rendering:pixelated;touch-action:none}
#tpb{left:calc(10px + env(safe-area-inset-left,0px));top:calc(210px + env(safe-area-inset-top,0px));width:44px;height:44px;font-size:20px}
#tpm{position:fixed;z-index:15;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:460px;margin:auto;background:rgba(10,12,16,.93);border:2px solid var(--line);border-radius:12px;padding:12px;display:none;flex-direction:column;gap:6px;overflow-y:auto;touch-action:pan-y;font-size:14px;line-height:1.35}
#tpm *{touch-action:pan-y}
#tpm button{font:inherit;color:#fff;background:rgba(255,255,255,.14);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;flex:0 0 auto}
#tpm .ch button{width:44px;text-align:center}.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#acb{left:calc(10px + env(safe-area-inset-left,0px));top:calc(262px + env(safe-area-inset-top,0px));width:44px;height:44px;font-size:20px}
#chm,#acm{position:fixed;z-index:15;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:460px;margin:auto;background:rgba(10,12,16,.93);border:2px solid var(--line);border-radius:12px;padding:12px;display:none;flex-direction:column;gap:6px;overflow-y:auto;touch-action:pan-y;font-size:14px;line-height:1.35}
#chm *,#acm *{touch-action:pan-y}
#chm button,#acm button{font:inherit;color:#fff;background:rgba(255,255,255,.14);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;flex:0 0 auto}
#chm .ch button,#acm .ch button{width:44px;text-align:center}
.ac{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.06)}.ac.on{background:rgba(255,216,74,.18)}.ac small{opacity:.8}
</style>
</head>
<body>
<div id="t"></div>
<div id="x"></div>
<div id="c"></div>
<div id="bar"></div>
<div id="h"></div>
<div id="jb"><div id="jk"></div></div>
<div class="b" id="dist">👁3</div>
<div class="b" id="new">☰</div>
<div class="b" id="craft">🔨</div>
<div class="b" id="bag">🎒</div>
<div class="b" id="tpb">🧭</div>
<div class="b" id="acb">🏆</div>
<div class="b" id="admb">👥</div>
<canvas id="mm" width="90" height="90"></canvas><div id="hp"></div><div id="dmg"></div>
<div class="b" id="fly">🕊</div>
<div class="b" id="mode">⛏</div>
<div class="b" id="jump">▲</div>
<div id="menu"><h1>🧱 Блоккрафт</h1><div id="wl"></div><div class="nb"><button id="nc">＋ Креатив</button><button id="ns">＋ Виживання</button></div>
<div class="nb"><button id="nm">🌐 Мультиплеєр</button></div>
<div id="mmsg"></div>
<div id="acc">
 <div id="lg" class="col"><input id="un" placeholder="Нік (a–z, 0–9, _)" maxlength="16" autocomplete="username"><input id="pw" type="password" placeholder="Пароль (від 6 символів)" autocomplete="current-password">
  <div class="nb"><button id="li">Увійти</button><button id="rg">Реєстрація</button></div></div>
 <div id="inr" class="col" style="display:none"><div class="nb"><span id="hi" style="flex:1;align-self:center"></span><button id="lo">Вийти</button></div>
  <input id="room" placeholder="Назва кімнати" maxlength="20">
  <div class="nb"><button id="mj">Приєднатися</button></div>
  <div class="nb"><select id="rm"><option value="creative">🎨 Креатив</option><option value="survival">⚔️ Виживання</option></select><label style="align-self:center;display:flex;gap:6px;align-items:center"><input type="checkbox" id="rp">Приватна</label></div>
  <div class="nb"><button id="mc">＋ Створити кімнату</button></div></div>
</div>
</div>
<div id="cr"></div><div id="tpm"></div><div id="chm"></div><div id="acm"></div><div id="adm"></div><div id="iv"></div><div id="mp"><i></i></div>
<script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ====== ВСТАВТЕ СЮДИ КОНФІГ ВАШОГО FIREBASE (Project settings → Your apps → Web) ======
const CFG={
  apiKey:"AIzaSyCRz-kRrWvp2_kAQJoazPZvENfwmYUbwp0",
  authDomain:"bloxcraft-87210.firebaseapp.com",
  databaseURL:"https://bloxcraft-87210-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"bloxcraft-87210",
  storageBucket:"bloxcraft-87210.firebasestorage.app",
  messagingSenderId:"289750007584",
  appId:"1:289750007584:web:3bfc960e703a4bd55de145"
};
// =====================================================================================
let idx=[];try{idx=JSON.parse(localStorage.getItem('bc_idx')||'[]')||[]}catch(e){}
try{if(!idx.length&&localStorage.getItem('bc1')){localStorage.setItem('bcw_old',localStorage.getItem('bc1'));idx=[{id:'old',name:'Старий світ',mode:'creative',t:Date.now()}]}}catch(e){}
const LS=document.getElementById('wl'),MN=document.getElementById('menu');
function sIdx(){try{localStorage.setItem('bc_idx',JSON.stringify(idx))}catch(e){}}
function mm(){LS.innerHTML=idx.length?'':'<p>Світів ще немає. Створіть перший!</p>';
 idx.forEach(w=>{const r=document.createElement('div');r.className='r';
  const a=document.createElement('button');a.className='pl';a.textContent=(w.mode=='creative'?'🎨 ':'⚔️ ')+w.name;a.onclick=()=>go(w);
  const d=document.createElement('button');d.className='dl';d.textContent='🗑';let ar=0;
  d.onclick=()=>{if(!ar){ar=1;d.textContent='?';setTimeout(()=>{ar=0;d.textContent='🗑'},2500)}else{idx=idx.filter(x=>x!==w);try{localStorage.removeItem('bcw_'+w.id)}catch(e){}sIdx();mm()}};
  r.append(a,d);LS.appendChild(r)})}
function mkW(mode){const w={id:Date.now().toString(36),name:'Світ '+(idx.length+1),mode,t:Date.now()};idx.push(w);go(w)}
function go(w){if(!w.mp){w.t=Date.now();sIdx()}MN.style.display='none';start(w)}
const $=i=>document.getElementById(i),mmsg=$('mmsg'),msg=t=>{mmsg.textContent=t;try{mmsg.scrollIntoView({block:'nearest'})}catch(e){}};
let FB=null,AU=null,ME=null,authOn=false;
const em=n=>n+'@bloxcraft.game',NR=/^[a-z0-9_]{3,16}$/;
function er(e,ctx){const c=String(e&&e.code||''),t=String(e&&e.message||e);
 if(/permission/i.test(c+t))return ctx=='room'?'Немає доступу: кімната приватна. Попросіть власника додати вас у білий список.':'База відхилила запит (permission denied). Вставте правила Realtime Database з інструкції й натисніть Publish.';
 const m={'auth/email-already-in-use':'Цей нік зайнятий','auth/wrong-password':'Невірний пароль','auth/invalid-credential':'Невірний нік або пароль','auth/user-not-found':'Користувача не знайдено','auth/weak-password':'Пароль закороткий',
 'auth/operation-not-allowed':'У Firebase вимкнений вхід за email і паролем: Authentication → Sign-in method → Email/Password → Enable.',
 'auth/configuration-not-found':'Authentication не активований: Build → Authentication → Get started, потім увімкніть Email/Password.',
 'auth/network-request-failed':'Немає зв’язку з Firebase (мережа або блокувальник реклами).',
 'auth/invalid-api-key':'Невірний apiKey у конфігу.','auth/unauthorized-domain':'Додайте домен сайту: Authentication → Settings → Authorized domains.',
 'auth/operation-not-supported-in-this-environment':'Відкрийте гру за адресою https://, а не як файл.','auth/too-many-requests':'Забагато спроб, зачекайте трохи.'};
 return m[c]||('Помилка: '+(c||t))}
async function refreshMe(u){if(!u){ME=null;$('lg').style.display='flex';$('inr').style.display='none';return}
 let n=null;try{n=(await FB.ref('users/'+u.uid+'/name').once('value')).val()}catch(e){msg(er(e))}
 ME={uid:u.uid,name:n||u.email.split('@')[0]};$('hi').textContent='👤 '+ME.name;$('lg').style.display='none';$('inr').style.display='flex'}
$('nm').onclick=()=>{const a=$('acc');a.style.display=a.style.display=='flex'?'none':'flex';if(a.style.display!='flex'||authOn)return;
 if(!window.firebase){msg('Firebase не завантажився: перевірте інтернет або блокувальник реклами');a.style.display='none';return}
 let st=true;try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){st=false}
 try{if(!firebase.apps.length)firebase.initializeApp(CFG);FB=firebase.database();AU=firebase.auth();authOn=true;
  if(!st)try{AU.setPersistence(firebase.auth.Auth.Persistence.NONE)}catch(e){}
  AU.onAuthStateChanged(u=>refreshMe(u));
  if(location.protocol==='file:'||!st)msg('Увага: гра відкрита не через https:// або сховище браузера заблоковане. Вхід може не працювати. Відкрийте гру за адресою GitHub Pages у звичайному браузері.')
 }catch(e){msg('Помилка запуску Firebase: '+(e.message||e)+'. Відкрийте гру за адресою https:// (GitHub Pages) у звичайному браузері, а не в перегляді файлу.');a.style.display='none'}};
$('rg').onclick=async()=>{const n=$('un').value.trim().toLowerCase(),pw=$('pw').value;
 if(!NR.test(n))return msg('Нік: 3–16 символів, лише a–z, 0–9 та _');if(pw.length<6)return msg('Пароль: щонайменше 6 символів');
 msg('Реєстрація…');
 try{if((await FB.ref('usernames/'+n).once('value')).exists())return msg('Цей нік уже зайнятий');
  const c=await AU.createUserWithEmailAndPassword(em(n),pw);
  await FB.ref('usernames/'+n).set(c.user.uid);await FB.ref('users/'+c.user.uid).set({name:n});await refreshMe(c.user);msg('Готово, ви увійшли!')}catch(e){msg(er(e))}};
$('li').onclick=async()=>{const n=$('un').value.trim().toLowerCase(),pw=$('pw').value;msg('Вхід…');
 try{await AU.signInWithEmailAndPassword(em(n),pw);msg('')}catch(e){msg(er(e))}};
addEventListener('error',ev=>msg(ev.message==='Script error.'?'Помилка в скрипті Firebase. Відкрийте гру за адресою https:// у звичайному браузері (не з перегляду файлу) і оновіть сторінку.':'Помилка: '+ev.message));
$('lo').onclick=async()=>{try{await AU.signOut()}catch(e){}await refreshMe(null);msg('Ви вийшли з акаунта')};
async function enter(create){
 const room=($('room').value.trim().toLowerCase().replace(/[.$#\[\]\/]/g,'')).slice(0,20);
 if(!ME)return msg('Спершу увійдіть');if(!room)return msg('Введіть назву кімнати');
 msg('Підключення…');const R=FB.ref('rooms/'+room);
 try{let meta=(await R.child('meta').once('value')).val();
  if(!meta){if(!create)return msg('Кімнату не знайдено. Створіть її.');
   meta={owner:ME.uid,ownerName:ME.name,mode:$('rm').value,private:$('rp').checked,seed:(Math.random()*1e9)|0,created:Date.now()};
   await R.child('meta').set(meta)}
  else if(create)return msg('Кімната з такою назвою вже існує');
  const sv0=(await R.child('saves/'+ME.uid).once('value')).val()||{},es=await R.child('edits').once('value'),e={};
  es.forEach(c=>{const a=c.key.split('_').map(Number),k=((a[0]>>4)+32768)*65536+((a[2]>>4)+32768);(e[k]=e[k]||[]).push([(a[0]&15)+((a[2]&15)<<4)+(a[1]<<8),c.val()])});
  go({id:'mp_'+room+'_'+ME.uid,mode:meta.mode,mp:{R,name:ME.name,room,uid:ME.uid,owner:meta.owner===ME.uid,meta},sv:{...sv0,seed:meta.seed,e}});
 }catch(err){msg(er(err,'room'))}}
$('mj').onclick=()=>enter(false);$('mc').onclick=()=>enter(true);
document.getElementById('nc').onclick=()=>mkW('creative');document.getElementById('ns').onclick=()=>mkW('survival');
mm();
function start(W){

   if(bm==2&&r1>.55){const y0=colInfo(ox,oz).h;if(y0>SEA+1&&y0<SEA+60){tryS('mummy',ox+.5,y0+1,oz+1.5);tryS('mummy',ox-.5,y0+1,oz-.5)}}}
  if(hs(rx,24,rz)>.5){const y0=mineY(ox,oz,colInfo(ox,oz).h);tryS('archer',ox+10.5,y0,oz+.5);tryS('archer',ox-10.5,y0,oz+.5)}}}
let jumpOn=false;const jumpBtn=document.getElementById('jump');
jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();jumpOn=true;jumpBtn.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(n=>jumpBtn.addEventListener(n,()=>{jumpOn=false;jumpBtn.classList.remove('on')}));
function attack(){const d=new THREE.Vector3();cam.getWorldDirection(d);
 for(const z of Z){const vx=z.x-cam.position.x,vy=z.y+.9-cam.position.y,vz=z.z-cam.position.z,L2=Math.hypot(vx,vy,vz);
  if(L2<4&&(vx*d.x+vy*d.y+vz*d.z)/L2>.85){z.hp-=DMG[tool(37)];z.vy=Math.max(z.vy,4);if(!hit(z.x+d.x*.7,z.y,z.z+d.z*.7)){z.x+=d.x*.7;z.z+=d.z*.7}flash(z,1);setTimeout(()=>flash(z,0),150);return true}}
 return false}
function act(){
 const hv=hb[cur];if(useItem(hv))return;if(hv>=26&&hv<=28){bucket(hv);return}
 if(!creative){if(attack())return;if(mode=='break')return}
 const r=ray();if(!r)return;
 if(mode=='break'){if(r.y==0)return;setB(r.x,r.y,r.z,0)}
 else{const sb=hb[cur];if(!sb||sb>=20||(!creative&&!(inv[sb]>0)))return;
  const{px:x,py:y,pz:z}=r;if(y<0||y>=H||solid(get(x,y,z)))return;
  const old=get(x,y,z);setB(x,y,z,sb);if(hit(p.x,p.y,p.z)){setB(x,y,z,old);return}
  if(!creative){inv[sb]--;invSlots()}}
 try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
}
// дотики
const T=document.getElementById('t'),jb=document.getElementById('jb'),jk=document.getElementById('jk');
let jp=null,jo=null,lp=null,ls=null;const jv={x:0,y:0};
T.addEventListener('pointerdown',e=>{
 e.preventDefault();try{T.setPointerCapture(e.pointerId)}catch(_){}
 if(jp===null&&e.clientX<innerWidth*.45){jp=e.pointerId;jo={x:e.clientX,y:e.clientY};
  jb.style.left=e.clientX-60+'px';jb.style.top=e.clientY-60+'px';jb.style.bottom='auto';jb.classList.add('on')}
 else if(lp===null){lp=e.pointerId;ls={t:performance.now(),m:0,x:e.clientX,y:e.clientY}}
});
T.addEventListener('pointermove',e=>{
 if(e.pointerId===jp){let dx=e.clientX-jo.x,dy=e.clientY-jo.y;const l=Math.hypot(dx,dy),m=55;
  if(l>m){dx*=m/l;dy*=m/l}jv.x=dx/m;jv.y=-dy/m;jk.style.transform='translate('+dx+'px,'+dy+'px)'}
 else if(e.pointerId===lp){const dx=e.clientX-ls.x,dy=e.clientY-ls.y;ls.x=e.clientX;ls.y=e.clientY;ls.m+=Math.abs(dx)+Math.abs(dy);
  yaw-=dx*.006;pitch=Math.max(-1.5,Math.min(1.5,pitch-dy*.006))}
});
const up=e=>{
 if(e.pointerId===jp){jp=null;jv.x=jv.y=0;jk.style.transform='';jb.classList.remove('on');jb.style.left=jb.style.top=jb.style.bottom=''}
 else if(e.pointerId===lp){if(e.type=='pointerup'&&ls.m<14&&performance.now()-ls.t<350)act();lp=null}};
T.addEventListener('pointerup',up);T.addEventListener('pointercancel',up);
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space')jumpOn=true});
addEventListener('keyup',e=>{K[e.code]=0;if(e.code=='Space')jumpOn=false});

// цикл
let last=performance.now(),fr=0;const info=document.getElementById('c');
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;fr++;
 tm+=dt/1200;if(!fx){fx=1;let g=0;while(hit(p.x,p.y,p.z)&&g++<100)p.y+=1}lighting(dt);{const al=Math.max(0,p.y-SEA-20);scene.fog.near=R*8+al*.6;scene.fog.far=R*16-2+al*.9}fallT.offset.y=(fallT.offset.y+dt*1.3)%1;fluids(dt);mini(dt);eruStep(dt);fireTick(dt);farmTick(dt);achTick(dt);mobTick(dt);
 stream();if(fr%90==0){unload();info.textContent='X '+Math.floor(p.x)+'  Y '+Math.floor(p.y)+'  Z '+Math.floor(p.z)+(MPR?'  👥'+(PL.size+1):'')}
 if(tpWait&&tpStep()){cam.position.set(p.x,p.y+1.6,p.z);cam.rotation.set(pitch,yaw,0);ren.render(scene,cam);return}
 let mx=jv.x+(K.KeyD?1:0)-(K.KeyA?1:0),my=jv.y+(K.KeyW?1:0)-(K.KeyS?1:0);
 const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
 const wx0=Math.floor(p.x),wz0=Math.floor(p.z),wy0=Math.floor(p.y+.6),gw=get(wx0,wy0,wz0),wat=(gw===7&&lvG(wx0,wy0,wz0)>=3)||gw===19||gw===79;
 const SP=flying?9:wat?3:4.6,s=Math.sin(yaw),c=Math.cos(yaw);
 const vx=(-s*my+c*mx)*SP,vz=(-c*my-s*mx)*SP;
 let bx=false,bz=false;
 const nx=p.x+vx*dt;if(!hit(nx,p.y,p.z))p.x=nx;else bx=true;
 const nz=p.z+vz*dt;if(!hit(p.x,p.y,nz))p.z=nz;else bz=true;
 p.vy=flying?(jumpOn?6:0)+my*Math.sin(pitch)*9:wat?Math.max(-4,p.vy-10*dt):Math.max(-30,p.vy-24*dt);
 if(wat&&jumpOn&&!flying)p.vy=Math.max(p.vy,3.4);
 const ny=p.y+p.vy*dt;p.ground=false;
 if(hit(p.x,ny,p.z)){if(p.vy<0){p.ground=true;p.y=Math.floor(ny)+1}p.vy=0}else p.y=ny;
 if(!flying&&p.ground&&(jumpOn||((bx||bz)&&l>.3)))p.vy=8.2;
 else if(!flying&&wat&&(bx||bz)&&l>.3)p.vy=Math.max(p.vy,3.4);
 cam.position.set(p.x,p.y+1.6,p.z);cam.rotation.set(pitch,yaw,0);
 const r=ray();if(r){sel.visible=true;sel.position.set(r.x+.5,r.y+.5,r.z+.5)}else sel.visible=false;
 if(!creative)survive(dt,wat);if(MPR)mpUpd(dt);ren.render(scene,cam);
}
requestAnimationFrame(loop);
}
